<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEM Facility Data — Australian Energy Dashboard</title>
  <meta name="description" content="5-minute dispatch data for NEM generators and storage — battery, wind, solar, gas and coal across all regions.">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #ffffff;
    --bg-subtle: #f9fafb;
    --border:    #e5e7eb;
    --text-1:    #111827;
    --text-2:    #6b7280;
    --text-3:    #9ca3af;
    --accent:    #2563eb;
    --green:     #059669;
    --red:       #dc2626;
    --amber:     #d97706;
    --purple:    #6d28d9;

    /* Tech accent colours */
    --battery-color: #6d28d9;
    --wind-color:    #0891b2;
    --solar-color:   #d97706;
    --gas-color:     #ea580c;
    --coal-color:    #475569;
  }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text-1);
    min-height: 100vh; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 28px 120px; }

  /* ── Controls strip ────────────────────────────────────────────────────────── */
  .controls-strip {
    display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;
    margin-bottom: 36px; padding: 20px 24px;
    background: var(--bg-subtle); border: 1px solid var(--border);
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
  .ctrl-label {
    font-size: 0.6875rem; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.07em;
  }

  /* Tech pills */
  .tech-pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .tech-pill {
    padding: 6px 14px; border: 1px solid var(--border);
    background: var(--bg); font-size: 0.8125rem; font-weight: 500;
    font-family: 'IBM Plex Sans', sans-serif; color: var(--text-2);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tech-pill:hover { border-color: var(--text-1); color: var(--text-1); }
  .tech-pill.active[data-tech="battery"] { background: var(--battery-color); border-color: var(--battery-color); color: #fff; }
  .tech-pill.active[data-tech="wind"]    { background: var(--wind-color);    border-color: var(--wind-color);    color: #fff; }
  .tech-pill.active[data-tech="solar"]   { background: var(--solar-color);   border-color: var(--solar-color);   color: #fff; }
  .tech-pill.active[data-tech="gas"]     { background: var(--gas-color);     border-color: var(--gas-color);     color: #fff; }
  .tech-pill.active[data-tech="coal"]    { background: var(--coal-color);    border-color: var(--coal-color);    color: #fff; }

  /* Region pills */
  .region-pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .region-pill {
    padding: 6px 12px; border: 1px solid var(--border);
    background: var(--bg); font-size: 0.8125rem; font-weight: 500;
    font-family: 'IBM Plex Sans', sans-serif; color: var(--text-2);
    cursor: pointer; transition: all 0.15s; font-variant-numeric: tabular-nums;
  }
  .region-pill:hover { border-color: var(--text-1); color: var(--text-1); }
  .region-pill.active { background: var(--text-1); border-color: var(--text-1); color: #fff; }

  /* Load button + status */
  .load-btn {
    padding: 9px 24px; background: var(--text-1); color: #fff; border: none;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
    font-size: 0.875rem; cursor: pointer; transition: background 0.15s;
    align-self: flex-end;
  }
  .load-btn:hover:not(:disabled) { background: var(--accent); }
  .load-btn:disabled { background: var(--text-3); cursor: not-allowed; }

  .cb-strip {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.8rem; color: var(--text-3);
    align-self: flex-end; padding-bottom: 2px;
  }
  .cb-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-3); flex-shrink: 0; transition: background 0.3s;
  }
  .cb-dot.fresh { background: var(--green); }
  .cb-dot.err   { background: var(--red); }

  /* ── Date range ────────────────────────────────────────────────────────────── */
  .date-range {
    font-size: 0.8125rem; color: var(--text-2); margin-bottom: 28px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Fleet summary bar ─────────────────────────────────────────────────────── */
  .fleet-summary {
    display: none;
    border: 1px solid var(--border);
    margin-bottom: 32px;
    padding: 18px 24px;
    gap: 0;
  }
  .fleet-summary.visible { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .fleet-stat { padding: 4px 16px; border-right: 1px solid var(--border); }
  .fleet-stat:first-child { padding-left: 0; }
  .fleet-stat:last-child  { border-right: none; }
  .fleet-stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 600; margin-bottom: 4px; }
  .fleet-stat-value { font-size: 1.125rem; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .fleet-stat-value.green  { color: var(--green); }
  .fleet-stat-value.amber  { color: var(--amber); }
  .fleet-stat-value.purple { color: var(--purple); }
  .fleet-stat-value.red    { color: var(--red); }

  /* ── Facility cards grid ───────────────────────────────────────────────────── */
  .facilities-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(580px, 1fr));
    gap: 24px;
  }
  @media (max-width: 680px) {
    .facilities-grid { grid-template-columns: 1fr; }
  }

  .facility-card {
    border: 1px solid var(--border);
    background: var(--bg);
    overflow: hidden;
  }

  .card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 16px 18px 12px; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-title { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 1rem; font-weight: 600; color: var(--text-1); line-height: 1.3; }
  .card-meta  { font-size: 0.75rem; color: var(--text-3); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* Tech badge */
  .tech-badge {
    flex-shrink: 0; padding: 3px 8px;
    font-size: 0.6875rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    border: 1px solid currentColor;
  }
  .tech-badge.battery { color: var(--battery-color); }
  .tech-badge.wind    { color: var(--wind-color); }
  .tech-badge.solar   { color: var(--solar-color); }
  .tech-badge.gas     { color: var(--gas-color); }
  .tech-badge.coal    { color: var(--coal-color); }

  /* Stats row */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    padding: 12px 18px; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .stat-label { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 600; margin-bottom: 3px; }
  .stat-value { font-size: 0.9375rem; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .stat-value.green  { color: var(--green); }
  .stat-value.amber  { color: var(--amber); }
  .stat-value.purple { color: var(--purple); }
  .stat-value.red    { color: var(--red); }
  .stat-value.muted  { color: var(--text-3); font-weight: 400; }

  /* FCAS note (battery only) */
  .fcas-note {
    font-size: 0.7375rem; color: var(--text-3); line-height: 1.5;
    padding: 8px 18px; border-bottom: 1px solid var(--border);
    background: var(--bg-subtle);
  }

  /* Chart */
  .chart-wrapper { height: 200px; padding: 12px 18px 14px; position: relative; }
  .no-data {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 0.875rem; font-style: italic;
  }

  /* ── Loading / error screens ───────────────────────────────────────────────── */
  .loading-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 80px 24px;
    color: var(--text-3); text-align: center;
  }
  .spinner {
    width: 36px; height: 36px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg  { font-size: 0.9375rem; color: var(--text-2); }
  .loading-sub  { font-size: 0.8125rem; color: var(--text-3); max-width: 400px; }

  .error-screen {
    background: #fff5f5; border: 1px solid #fecaca;
    padding: 28px; margin: 8px 0;
  }
  .error-screen h3 { color: var(--red); margin-bottom: 8px; font-size: 1rem; }
  .error-screen p  { color: #7f1d1d; font-size: 0.875rem; margin-bottom: 6px; }
  .error-screen code { background: #fee2e2; padding: 2px 5px; font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; }
  .retry-btn {
    margin-top: 12px; padding: 8px 18px;
    background: var(--text-1); color: #fff; border: none;
    font-family: inherit; font-size: 0.875rem; cursor: pointer;
  }
  .retry-btn:hover { background: var(--accent); }

  .empty-state {
    padding: 60px 24px; text-align: center; color: var(--text-3);
    border: 1px solid var(--border);
  }
  .empty-state h3 { font-size: 1rem; color: var(--text-2); margin-bottom: 8px; }
  .empty-state p  { font-size: 0.875rem; }

  /* ── Spinner inline (for button) ───────────────────────────────────────────── */
  @keyframes spin-inline { to { transform: rotate(360deg); } }
  .spinner-inline {
    display: inline-block; width: 11px; height: 11px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin-inline 0.7s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  </style>
</head>
<body>
<div class="container">

  <script>
    window.NAV_TITLE    = 'Facility Data';
    window.NAV_SUBTITLE = '5-minute dispatch intervals for NEM generators and storage — battery, wind, solar, gas and coal across all regions.';
    window.NAV_LIVE     = false;
  </script>
  <div id="site-nav"></div>
  <script src="nav.js" data-active="batteries"></script>

  <!-- Controls strip -->
  <div class="controls-strip">
    <div class="ctrl-group">
      <div class="ctrl-label">Technology</div>
      <div class="tech-pills" id="techPills">
        <button class="tech-pill active" data-tech="battery" onclick="selectTech('battery')">Battery</button>
        <button class="tech-pill"        data-tech="wind"    onclick="selectTech('wind')">Wind</button>
        <button class="tech-pill"        data-tech="solar"   onclick="selectTech('solar')">Solar</button>
        <button class="tech-pill"        data-tech="gas"     onclick="selectTech('gas')">Gas</button>
        <button class="tech-pill"        data-tech="coal"    onclick="selectTech('coal')">Coal</button>
      </div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">Region</div>
      <div class="region-pills" id="regionPills">
        <button class="region-pill active" data-region="NSW1" onclick="selectRegion('NSW1')">NSW</button>
        <button class="region-pill"        data-region="VIC1" onclick="selectRegion('VIC1')">VIC</button>
        <button class="region-pill"        data-region="QLD1" onclick="selectRegion('QLD1')">QLD</button>
        <button class="region-pill"        data-region="SA1"  onclick="selectRegion('SA1')">SA</button>
        <button class="region-pill"        data-region="TAS1" onclick="selectRegion('TAS1')">TAS</button>
        <button class="region-pill"        data-region="all"  onclick="selectRegion('all')">All NEM</button>
      </div>
    </div>
    <button class="load-btn" id="loadBtn" onclick="loadFacilities()">Load Data</button>
    <div class="cb-strip">
      <div class="cb-dot" id="cbDot"></div>
      <span id="cbText"></span>
    </div>
  </div>

  <!-- Date range -->
  <p class="date-range" id="dateRange"></p>

  <!-- Fleet summary (shown after load) -->
  <div class="fleet-summary" id="fleetSummary">
    <div class="fleet-stat">
      <div class="fleet-stat-label">Facilities</div>
      <div class="fleet-stat-value" id="fs-count">—</div>
    </div>
    <div class="fleet-stat">
      <div class="fleet-stat-label">Total Capacity</div>
      <div class="fleet-stat-value" id="fs-mw">—</div>
    </div>
    <div class="fleet-stat" id="fs-stat3-wrap">
      <div class="fleet-stat-label" id="fs-stat3-label">—</div>
      <div class="fleet-stat-value" id="fs-stat3">—</div>
    </div>
    <div class="fleet-stat" id="fs-stat4-wrap">
      <div class="fleet-stat-label" id="fs-stat4-label">—</div>
      <div class="fleet-stat-value" id="fs-stat4">—</div>
    </div>
    <div class="fleet-stat" id="fs-stat5-wrap">
      <div class="fleet-stat-label" id="fs-stat5-label">—</div>
      <div class="fleet-stat-value" id="fs-stat5">—</div>
    </div>
  </div>

  <!-- Main content area -->
  <div id="main">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-msg">Selecting facilities…</div>
      <div class="loading-sub">Choose technology and region, then click Load Data</div>
    </div>
  </div>

</div>

<script>
'use strict';

const API_BASE = window.location.protocol === 'file:'
  ? 'http://localhost:3000'
  : window.location.origin;

const NEM_TZ = 'Australia/Brisbane';

// ── State ─────────────────────────────────────────────────────────────────────
let selectedTech   = 'battery';
let selectedRegion = 'NSW1';
const charts = {};

// ── Pill selection ────────────────────────────────────────────────────────────
function selectTech(tech) {
  selectedTech = tech;
  document.querySelectorAll('.tech-pill').forEach(el => {
    el.classList.toggle('active', el.dataset.tech === tech);
  });
}

function selectRegion(region) {
  selectedRegion = region;
  document.querySelectorAll('.region-pill').forEach(el => {
    el.classList.toggle('active', el.dataset.region === region);
  });
}

// ── Formatters ────────────────────────────────────────────────────────────────
const fmtMW = v => (v === null || v === undefined) ? '—' : `${parseFloat(v).toFixed(1)} MW`;
const fmtGWh = v => (v === null || v === undefined) ? '—' : `${parseFloat(v).toFixed(2)} GWh`;
const fmtPct = v => (v === null || v === undefined) ? '—' : `${parseFloat(v).toFixed(1)}%`;
const fmtPrice = v => (v === null || v === undefined) ? '—' : `$${parseFloat(v).toFixed(0)}/MWh`;

function fmtRevenue(v) {
  if (v === null || v === undefined) return '—';
  const abs  = Math.abs(v);
  const sign = v < 0 ? '−$' : '$';
  if (abs >= 1_000_000) return `${sign}${(abs / 1_000_000).toFixed(2)}M`;
  if (abs >= 1_000)     return `${sign}${(abs / 1_000).toFixed(1)}k`;
  return `${sign}${abs.toFixed(0)}`;
}

function fmtAxisLabel(isoStr) {
  const d = new Date(isoStr);
  const day  = d.toLocaleDateString('en-AU',  { day: '2-digit', month: 'short', timeZone: NEM_TZ });
  const time = d.toLocaleTimeString('en-AU',  { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: NEM_TZ });
  return `${day} ${time}`;
}

function fmtTooltipTime(isoStr) {
  return new Date(isoStr).toLocaleString('en-AU', {
    day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: false,
    timeZone: NEM_TZ,
  }) + ' AEST';
}

// ── Tech display config ───────────────────────────────────────────────────────
const TECH_CONFIG = {
  battery: { label: 'Battery', color: '#6d28d9', fillAlpha: 0.15 },
  wind:    { label: 'Wind',    color: '#0891b2', fillAlpha: 0.15 },
  solar:   { label: 'Solar',   color: '#d97706', fillAlpha: 0.18 },
  gas:     { label: 'Gas',     color: '#ea580c', fillAlpha: 0.15 },
  coal:    { label: 'Coal',    color: '#475569', fillAlpha: 0.15 },
};

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Fleet summary ─────────────────────────────────────────────────────────────
function updateFleetSummary(facilities, isBattery) {
  const active = facilities.filter(f => f.stats.intervals > 0);
  const totalMW = facilities.reduce((s, f) => s + (f.capacityMW || 0), 0);

  document.getElementById('fs-count').textContent = `${facilities.length}`;
  document.getElementById('fs-mw').textContent    = `${totalMW.toFixed(0)} MW`;

  if (isBattery) {
    const totalDch = active.reduce((s, f) => s + (f.stats.totalDischargeGWh || 0), 0);
    const totalChg = active.reduce((s, f) => s + (f.stats.totalChargeGWh    || 0), 0);
    const totalRev = active.reduce((s, f) => s + (f.stats.netEnergyMarketMV  || 0), 0);

    document.getElementById('fs-stat3-label').textContent = 'Total Discharge';
    document.getElementById('fs-stat3').textContent       = fmtGWh(totalDch);
    document.getElementById('fs-stat3').className         = 'fleet-stat-value green';

    document.getElementById('fs-stat4-label').textContent = 'Total Charge';
    document.getElementById('fs-stat4').textContent       = fmtGWh(totalChg);
    document.getElementById('fs-stat4').className         = 'fleet-stat-value amber';

    document.getElementById('fs-stat5-label').textContent = 'Energy Mkt Rev';
    document.getElementById('fs-stat5').textContent       = fmtRevenue(totalRev);
    document.getElementById('fs-stat5').className         = `fleet-stat-value ${totalRev >= 0 ? 'purple' : 'red'}`;

  } else {
    const totalGen = active.reduce((s, f) => s + (f.stats.totalGenerationGWh || 0), 0);
    const avgCF    = active.filter(f => f.stats.capacityFactorPct !== null);
    const meanCF   = avgCF.length
      ? avgCF.reduce((s, f) => s + f.stats.capacityFactorPct, 0) / avgCF.length
      : null;
    const gwapList = active.filter(f => f.stats.gwap !== null);
    const meanGwap = gwapList.length
      ? gwapList.reduce((s, f) => s + f.stats.gwap, 0) / gwapList.length
      : null;

    document.getElementById('fs-stat3-label').textContent = 'Total Generation';
    document.getElementById('fs-stat3').textContent       = fmtGWh(totalGen);
    document.getElementById('fs-stat3').className         = 'fleet-stat-value';

    document.getElementById('fs-stat4-label').textContent = 'Avg Cap. Factor';
    document.getElementById('fs-stat4').textContent       = fmtPct(meanCF);
    document.getElementById('fs-stat4').className         = 'fleet-stat-value';

    document.getElementById('fs-stat5-label').textContent = 'Fleet GWAP';
    document.getElementById('fs-stat5').textContent       = fmtPrice(meanGwap);
    document.getElementById('fs-stat5').className         = 'fleet-stat-value';
  }

  document.getElementById('fleetSummary').classList.add('visible');
}

// ── Build chart — battery ─────────────────────────────────────────────────────
function buildBatteryChart(facility, regionPrices) {
  const canvas = document.getElementById(`chart-${facility.code}`);
  if (!canvas) return;

  const rows = facility.data;
  if (!rows || !rows.length) {
    canvas.parentElement.innerHTML = '<div class="no-data">No interval data available for this period.</div>';
    return;
  }

  const priceMap = regionPrices[facility.region] || {};

  // Down-sample: max 600 bars for performance
  let sample = rows;
  if (rows.length > 600) {
    const step = Math.ceil(rows.length / 600);
    sample = rows.filter((_, i) => i % step === 0);
  }

  const labels      = sample.map(r => fmtAxisLabel(r.ts));
  const rawDates    = sample.map(r => r.ts);
  const discharge   = sample.map(r => r.dischargeMW > 0.1 ? r.dischargeMW : 0);
  const charge      = sample.map(r => r.chargeMW    > 0.1 ? -r.chargeMW   : 0);
  const priceData   = sample.map(r => priceMap[r.ts] ?? null);

  let cumRev = 0;
  const revenue = sample.map(r => {
    cumRev += (r.netMV ?? 0);
    return +cumRev.toFixed(0);
  });
  const finalRev = revenue[revenue.length - 1] ?? 0;

  if (charts[facility.code]) charts[facility.code].destroy();

  charts[facility.code] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Discharge (MW)',
          data: discharge,
          backgroundColor: 'rgba(5,150,105,0.75)',
          borderWidth: 0,
          barPercentage: 1.0, categoryPercentage: 1.0,
          yAxisID: 'y', order: 2,
        },
        {
          label: 'Charge (MW)',
          data: charge,
          backgroundColor: 'rgba(180,83,9,0.70)',
          borderWidth: 0,
          barPercentage: 1.0, categoryPercentage: 1.0,
          yAxisID: 'y', order: 2,
        },
        {
          label: `${facility.region} Price ($/MWh)`,
          data: priceData,
          type: 'line',
          borderColor: '#9ca3af',
          backgroundColor: 'transparent',
          borderWidth: 1,
          borderDash: [3, 3],
          pointRadius: 0,
          tension: 0,
          yAxisID: 'yPrice',
          order: 1,
          spanGaps: true,
        },
        {
          label: 'Cumulative Revenue ($)',
          data: revenue,
          type: 'line',
          borderColor: finalRev >= 0 ? '#6d28d9' : '#dc2626',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0,
          stepped: true,
          yAxisID: 'yRev',
          order: 0,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,0.92)',
          titleFont: { family: 'IBM Plex Mono', size: 11 },
          bodyFont:  { family: 'IBM Plex Sans', size: 12 },
          callbacks: {
            title: items => fmtTooltipTime(rawDates[items[0].dataIndex]),
            label: ctx => {
              const v = ctx.parsed.y;
              if (v === null || v === undefined) return null;
              if (ctx.dataset.label.startsWith('Discharge')) return `  Discharge: ${v.toFixed(1)} MW`;
              if (ctx.dataset.label.startsWith('Charge'))    return `  Charge:    ${Math.abs(v).toFixed(1)} MW`;
              if (ctx.dataset.label.includes('Price'))       return `  Price:     $${v.toFixed(0)}/MWh`;
              if (ctx.dataset.label.startsWith('Cumul'))     return `  Cum. Rev:  ${fmtRevenue(v)}`;
              return null;
            },
          },
        },
      },
      scales: {
        x: { display: false },
        y: {
          position: 'left',
          grid: { color: '#f3f4f6' },
          ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#9ca3af',
                   callback: v => `${v} MW` },
        },
        yPrice: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#9ca3af',
                   callback: v => `$${v}` },
        },
        yRev: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: finalRev >= 0 ? '#6d28d9' : '#dc2626',
                   callback: v => fmtRevenue(v), maxTicksLimit: 4 },
        },
      },
    },
  });
}

// ── Build chart — power (non-battery) ─────────────────────────────────────────
function buildPowerChart(facility, regionPrices, tech) {
  const canvas = document.getElementById(`chart-${facility.code}`);
  if (!canvas) return;

  const rows = facility.data;
  if (!rows || !rows.length) {
    canvas.parentElement.innerHTML = '<div class="no-data">No interval data available for this period.</div>';
    return;
  }

  const cfg      = TECH_CONFIG[tech] || TECH_CONFIG.wind;
  const priceMap = regionPrices[facility.region] || {};

  // Down-sample: max 800 points
  let sample = rows;
  if (rows.length > 800) {
    const step = Math.ceil(rows.length / 800);
    sample = rows.filter((_, i) => i % step === 0);
  }

  const labels    = sample.map(r => fmtAxisLabel(r.ts));
  const rawDates  = sample.map(r => r.ts);
  const powerData = sample.map(r => r.power);
  const priceData = sample.map(r => priceMap[r.ts] ?? null);
  const hasPrice  = priceData.some(p => p !== null);

  if (charts[facility.code]) charts[facility.code].destroy();

  const datasets = [
    {
      label: 'Power (MW)',
      data: powerData,
      borderColor: cfg.color,
      backgroundColor: hexToRgba(cfg.color, cfg.fillAlpha),
      borderWidth: 1.2,
      pointRadius: 0,
      fill: true,
      tension: 0.2,
      yAxisID: 'y',
    },
  ];

  if (hasPrice) {
    datasets.push({
      label: `${facility.region} Spot Price ($/MWh)`,
      data: priceData,
      borderColor: 'rgba(107,114,128,0.7)',
      backgroundColor: 'transparent',
      borderWidth: 1,
      borderDash: [3, 2],
      pointRadius: 0,
      fill: false,
      tension: 0.1,
      yAxisID: 'y1',
      spanGaps: true,
    });
  }

  charts[facility.code] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,0.92)',
          titleFont: { family: 'IBM Plex Mono', size: 11 },
          bodyFont:  { family: 'IBM Plex Sans', size: 12 },
          callbacks: {
            title: items => fmtTooltipTime(rawDates[items[0].dataIndex]),
            label: ctx => {
              const v = ctx.parsed.y;
              if (v === null || v === undefined) return null;
              if (ctx.dataset.yAxisID === 'y')  return `  Output: ${v.toFixed(1)} MW`;
              if (ctx.dataset.yAxisID === 'y1') return `  Price:  $${v.toFixed(0)}/MWh`;
              return null;
            },
          },
        },
      },
      scales: {
        x: { display: false },
        y: {
          position: 'left',
          grid: { color: '#f3f4f6' },
          ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#9ca3af',
                   callback: v => `${v} MW` },
        },
        ...(hasPrice ? {
          y1: {
            position: 'right',
            grid: { drawOnChartArea: false },
            ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#9ca3af',
                     callback: v => `$${v}` },
          }
        } : {}),
      },
    },
  });
}

// ── Render a battery card ─────────────────────────────────────────────────────
function renderBatteryCard(facility) {
  const s = facility.stats;
  const hasData = s.intervals > 0;
  const revClass = !hasData || s.netEnergyMarketMV === null ? 'muted'
    : s.netEnergyMarketMV >= 0 ? 'purple' : 'red';
  const netClass = !hasData || s.netEnergyGWh === null ? 'muted'
    : s.netEnergyGWh >= 0 ? 'green' : 'amber';

  const el = document.createElement('div');
  el.className = 'facility-card';
  el.id = `card-${facility.code}`;
  el.innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-title">${facility.name}</div>
        <div class="card-meta">${facility.code} · ${facility.region}${facility.capacityMW ? ' · ' + facility.capacityMW + ' MW' : ''}</div>
      </div>
      <span class="tech-badge battery">BESS</span>
    </div>
    <div class="stats-row">
      <div>
        <div class="stat-label">Discharge</div>
        <div class="stat-value green">${hasData ? fmtGWh(s.totalDischargeGWh) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Charge</div>
        <div class="stat-value amber">${hasData ? fmtGWh(s.totalChargeGWh) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Net Energy</div>
        <div class="stat-value ${netClass}">${hasData ? fmtGWh(s.netEnergyGWh) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Peak Discharge</div>
        <div class="stat-value">${hasData ? fmtMW(s.peakDischargeMW) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Peak Charge</div>
        <div class="stat-value">${hasData ? fmtMW(s.peakChargeMW) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Energy Mkt Rev <span title="Energy market only — FCAS not included" style="cursor:help;color:var(--text-3)">ⓘ</span></div>
        <div class="stat-value ${revClass}">${hasData ? fmtRevenue(s.netEnergyMarketMV) : '—'}</div>
      </div>
    </div>
    <div class="fcas-note">
      ⓘ Revenue is <strong>energy market only</strong> — FCAS payments (often the dominant battery revenue source) are not available through the OpenElectricity API and are not shown.
    </div>
    <div class="chart-wrapper">
      <canvas id="chart-${facility.code}"></canvas>
    </div>`;
  return el;
}

// ── Render a power card (wind / solar / gas / coal) ───────────────────────────
function renderPowerCard(facility, tech) {
  const s   = facility.stats;
  const cfg = TECH_CONFIG[tech] || TECH_CONFIG.wind;
  const hasData = s.intervals > 0;

  const el = document.createElement('div');
  el.className = 'facility-card';
  el.id = `card-${facility.code}`;
  el.innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-title">${facility.name}</div>
        <div class="card-meta">${facility.code} · ${facility.region}${facility.capacityMW ? ' · ' + facility.capacityMW + ' MW' : ''}</div>
      </div>
      <span class="tech-badge ${tech}">${cfg.label}</span>
    </div>
    <div class="stats-row">
      <div>
        <div class="stat-label">Avg Output</div>
        <div class="stat-value">${hasData ? fmtMW(s.avgPowerMW) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Peak Output</div>
        <div class="stat-value">${hasData ? fmtMW(s.maxPowerMW) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Cap. Factor</div>
        <div class="stat-value ${s.capacityFactorPct === null ? 'muted' : ''}">${hasData ? fmtPct(s.capacityFactorPct) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">Total Gen.</div>
        <div class="stat-value">${hasData ? fmtGWh(s.totalGenerationGWh) : '—'}</div>
      </div>
      <div>
        <div class="stat-label">GWAP</div>
        <div class="stat-value">${hasData && s.gwap !== null ? fmtPrice(s.gwap) : '—'}</div>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="chart-${facility.code}"></canvas>
    </div>`;
  return el;
}

// ── Main load function ────────────────────────────────────────────────────────
async function loadFacilities() {
  const tech   = selectedTech;
  const region = selectedRegion;
  const isBattery = tech === 'battery';

  const btn    = document.getElementById('loadBtn');
  const dot    = document.getElementById('cbDot');
  const cbText = document.getElementById('cbText');
  const mainEl = document.getElementById('main');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Loading…';
  dot.className = 'cb-dot';

  const regionLabel = region === 'all' ? 'All NEM' : region;
  const techLabel   = TECH_CONFIG[tech]?.label || tech;
  cbText.textContent = `Fetching ${techLabel} · ${regionLabel}…`;

  document.getElementById('fleetSummary').classList.remove('visible');
  document.getElementById('dateRange').textContent = '';

  mainEl.innerHTML = `
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-msg">Fetching ${techLabel} facilities in ${regionLabel}…</div>
      <div class="loading-sub">Discovering facilities via OpenElectricity, then fetching 8 days of 5-minute intervals. This typically takes 15–30 seconds.</div>
    </div>`;

  // Destroy old charts
  Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch(e){} delete charts[k]; });

  try {
    const url  = `${API_BASE}/api/bess-nsw?fueltech=${tech}&region=${region}`;
    const resp = await fetch(url);

    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.error || `Server returned ${resp.status}`);
    }

    const data = await resp.json();

    if (!data.success) throw new Error(data.error || 'API returned failure');

    // Update date range
    if (data.dateStart && data.dateEnd) {
      const fmt = iso => new Date(iso + '+10:00').toLocaleDateString('en-AU', {
        day: '2-digit', month: 'short', year: 'numeric', timeZone: NEM_TZ,
      });
      document.getElementById('dateRange').textContent =
        `${fmt(data.dateStart)} → ${fmt(data.dateEnd)} AEST · 5-minute intervals · top ${data.facilities.length} by installed capacity`;
    }

    // Empty state
    if (!data.facilities || !data.facilities.length) {
      mainEl.innerHTML = `
        <div class="empty-state">
          <h3>No ${techLabel} facilities found in ${regionLabel}</h3>
          <p>No operating ${techLabel.toLowerCase()} facilities were returned by the OpenElectricity API for this region combination.</p>
        </div>`;
      dot.className = 'cb-dot';
      cbText.textContent = `No ${techLabel} facilities in ${regionLabel}`;
      btn.disabled = false;
      btn.textContent = 'Load Data';
      return;
    }

    // Fleet summary
    updateFleetSummary(data.facilities, isBattery);

    // Render cards
    const grid = document.createElement('div');
    grid.className = 'facilities-grid';

    for (const f of data.facilities) {
      const card = isBattery ? renderBatteryCard(f) : renderPowerCard(f, tech);
      grid.appendChild(card);
    }

    mainEl.innerHTML = '';
    mainEl.appendChild(grid);

    // Build charts after DOM is ready
    requestAnimationFrame(() => {
      for (const f of data.facilities) {
        if (isBattery) buildBatteryChart(f, data.regionPrices);
        else           buildPowerChart(f, data.regionPrices, tech);
      }
    });

    dot.className = 'cb-dot fresh';
    cbText.textContent = `${techLabel} · ${regionLabel} · ${data.facilities.length} facilities · fetched ${new Date(data.fetchedAt).toLocaleTimeString('en-AU', { timeZone: NEM_TZ })} AEST`;

  } catch (err) {
    console.error('[facilities]', err);
    mainEl.innerHTML = `
      <div class="error-screen">
        <h3>⚠ Could not load facility data</h3>
        <p>${err.message}</p>
        <p>Ensure <code>OPENELECTRICITY_API_KEY</code> is set in your Vercel environment variables.</p>
        <button class="retry-btn" onclick="loadFacilities()">↺ Try Again</button>
      </div>`;
    dot.className = 'cb-dot err';
    cbText.textContent = 'Load failed: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Load Data';
  }
}

// ── Auto-load on page open ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadFacilities();
});
</script>
