<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Performance — Australian Energy Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
  /* ── Reset ────────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Tokens ────────────────────────────────────────────────────────────── */
  :root {
    --bg:           #ffffff;
    --bg-subtle:    #f9fafb;
    --border:       #e5e7eb;
    --text-1:       #111827;
    --text-2:       #6b7280;
    --text-3:       #9ca3af;
    --accent:       #2563eb;
    --accent-bg:    #eff6ff;
    --positive:     #059669;
    --negative:     #dc2626;
  }

  /* ── Base ──────────────────────────────────────────────────────────────── */
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ────────────────────────────────────────────────────────────── */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  /* ── Header ────────────────────────────────────────────────────────────── */
  header {
    padding: 44px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }
  .header-inner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 2.125rem;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--text-1);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 0.9375rem;
    color: var(--text-2);
    font-weight: 400;
    max-width: 520px;
    line-height: 1.5;
  }
  .date-range {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6875rem;
    color: var(--text-3);
    margin-top: 8px;
    letter-spacing: 0.01em;
  }

  /* ── Navigation ────────────────────────────────────────────────────────── */
  .header-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: flex-start;
    padding-top: 6px;
  }
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 15px;
    font-size: 0.8125rem;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--text-2);
    background: var(--bg);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    white-space: nowrap;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .nav-link:hover {
    border-color: var(--text-1);
    color: var(--text-1);
  }
  .nav-link.active {
    background: var(--text-1);
    border-color: var(--text-1);
    color: #ffffff;
  }
  .nav-link.active:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ── Section title ─────────────────────────────────────────────────────── */
  .section-title {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-1);
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }

  /* ── Stat grid (shared across pages) ──────────────────────────────────── */
  .stat-label {
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-3);
    margin-bottom: 5px;
    font-weight: 500;
  }
  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--text-1);
  }
  .stat-value.muted  { color: var(--text-3); font-style: italic; }
  .stat-value.green  { color: var(--positive); }
  .stat-value.red    { color: var(--negative); }

  /* ── Badges ────────────────────────────────────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 0.625rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }

  /* ── Spinner ───────────────────────────────────────────────────────────── */
  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Loading screen ────────────────────────────────────────────────────── */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 96px 24px;
    text-align: center;
    gap: 16px;
    color: var(--text-2);
  }
  .loading-msg {
    font-size: 0.9rem;
    color: var(--text-2);
  }
  .loading-sub {
    font-size: 0.8125rem;
    color: var(--text-3);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Page footer ───────────────────────────────────────────────────────── */
  .page-footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-3);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .page-footer a {
    color: var(--text-2);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ── Cache status bar ──────────────────────────────────────────────────── */
  #globalCacheBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 10px 28px;
    display: flex; align-items: center; gap: 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem; color: var(--text-2);
    z-index: 999;
  }
  #globalCacheBar .gcb-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-3); flex-shrink: 0;
    transition: background 0.3s;
  }
  #globalCacheBar .gcb-dot.fresh  { background: var(--positive); }
  #globalCacheBar .gcb-dot.stale  { background: #f59e0b; }
  #globalCacheBar .gcb-dot.miss   { background: var(--negative); }
  #globalCacheBar .gcb-text { flex: 1; }
  #globalCacheBar .gcb-btn {
    padding: 5px 14px;
    background: var(--text-1); color: #fff;
    border: none; cursor: pointer;
    font-size: 0.75rem; font-family: inherit; font-weight: 500;
    flex-shrink: 0; transition: background 0.15s;
  }
  #globalCacheBar .gcb-btn:hover { background: var(--accent); }
  #globalCacheBar .gcb-btn:disabled { background: var(--text-3); cursor: not-allowed; }
  @keyframes gcb-spin { to { transform: rotate(360deg); } }
  .gcb-spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: gcb-spin 0.7s linear infinite;
    margin-right: 5px; vertical-align: middle;
  }
  body { padding-bottom: 44px; }

  /* ── Responsive ────────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .container { padding: 0 16px 96px; }
    h1 { font-size: 1.75rem; }
    .header-inner { flex-direction: column; gap: 20px; }
  }

  /* ── Facility type colours ─────────────────────────────────────────────── */
  :root {
    --wind:        #2563eb;
    --wind-light:  #dbeafe;
    --solar:       #d97706;
    --solar-light: #fef3c7;
    --gas:         #dc2626;
    --gas-light:   #fee2e2;
    --price-line:  #6b7280;
  }

  /* ── Legend ────────────────────────────────────────────────────────────── */
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 36px;
    padding: 14px 20px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8125rem;
    color: var(--text-2);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%; flex-shrink: 0;
  }

  /* ── Date range badge ──────────────────────────────────────────────────── */
  .date-range {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6875rem;
    color: var(--text-3);
    margin-top: 8px;
  }

  /* ── Facility grid ─────────────────────────────────────────────────────── */
  .facility-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }

  /* ── Facility card ─────────────────────────────────────────────────────── */
  .facility-card {
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-title {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.0625rem;
    font-weight: 600;
    color: var(--text-1);
    line-height: 1.3;
  }
  .card-meta {
    font-size: 0.6875rem;
    color: var(--text-2);
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.01em;
  }
  .type-badge {
    font-size: 0.625rem;
    font-weight: 600;
    padding: 3px 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    border: 1px solid currentColor;
  }
  .type-badge.wind  { color: var(--wind);  background: var(--wind-light);  border-color: rgba(37,99,235,0.3);  }
  .type-badge.solar { color: var(--solar); background: var(--solar-light); border-color: rgba(217,119,6,0.3);  }
  .type-badge.gas   { color: var(--gas);   background: var(--gas-light);   border-color: rgba(220,38,38,0.3);  }

  /* ── Stats row ─────────────────────────────────────────────────────────── */
  .stats-row {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .stat {
    flex: 1;
    padding: 14px 18px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }

  /* ── Chart wrapper ─────────────────────────────────────────────────────── */
  .chart-wrapper {
    padding: 20px;
    height: 400px;
    position: relative;
  }

  /* ── Not-found banner ──────────────────────────────────────────────────── */
  .not-found-banner {
    background: #fffbeb;
    border: 1px solid #fde68a;
    padding: 8px 16px;
    font-size: 0.75rem;
    color: #92400e;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── No data placeholder ───────────────────────────────────────────────── */
  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-3);
    font-size: 0.875rem;
    font-style: italic;
  }

  /* ── Error screen ──────────────────────────────────────────────────────── */
  .error-screen {
    background: #fff5f5;
    border: 1px solid #fecaca;
    padding: 32px;
    margin: 40px 0;
  }
  .error-screen h3 { color: var(--gas); margin-bottom: 12px; font-size: 1rem; }
  .error-screen p  { color: #7f1d1d; font-size: 0.875rem; margin-bottom: 8px; }
  .error-screen code {
    font-family: 'IBM Plex Mono', monospace;
    background: #fee2e2;
    padding: 2px 6px;
    font-size: 0.8rem;
  }
  .retry-btn {
    display: inline-block;
    margin-top: 16px;
    padding: 9px 18px;
    background: var(--text-1);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 0.8125rem;
    font-family: inherit;
    transition: background 0.15s;
  }
  .retry-btn:hover { background: var(--gas); }

  </style>
</head>
<body>

<div class="container">
    <script>
    window.NAV_TITLE    = 'Generator Data';
    window.NAV_SUBTITLE = 'Facility-level generation, capacity and dispatch data across the NEM.';
    window.NAV_LIVE     = false;
  </script>
  <div id="site-nav"></div>
  <script src="nav.js" data-active="generators"></script>

  <!-- Legend -->
  <div class="legend" id="legend" style="display:none">
    <div class="legend-item">
      <div class="legend-dot" style="background:#2563eb"></div>
      <span>Power output (MW) — left axis</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#6b7280"></div>
      <span>Regional spot price ($/MWh) — right axis</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#2563eb; opacity:.25; border-radius:0; width:18px; height:4px"></div>
      <span>Wind farm</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#d97706; opacity:.25; border-radius:0; width:18px; height:4px"></div>
      <span>Solar farm</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#dc2626; opacity:.25; border-radius:0; width:18px; height:4px"></div>
      <span>Gas / thermal</span>
    </div>
  </div>

  <!-- Main content area -->
  <div id="main">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-msg">Fetching 5-min interval data for 7 generators…</div>
      <div class="loading-sub">This may take 15–30 seconds</div>
    </div>
  </div>

  <div class="page-footer">
    <span>Source: OpenElectricity API — AEMO NEM dispatch data</span>
    <span id="fetchedAt"></span>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────────

  const API_URL = '';  // same-origin

  const TYPE_COLORS = {
    wind:  { line: '#2563eb', fill: 'rgba(37,99,235,0.08)'  },
    solar: { line: '#d97706', fill: 'rgba(217,119,6,0.08)'  },
    gas:   { line: '#dc2626', fill: 'rgba(220,38,38,0.08)'  },
  };

  const charts = {};

  // ── Fetch data ────────────────────────────────────────────────────────────────

  async function loadData() {
    const resp = await fetch(`${API_URL}/api/facility-data`);
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${resp.status}`);
    }
    return resp.json();
  }

  // ── Render ────────────────────────────────────────────────────────────────────

  function fmtDate(isoStr) {
    return new Date(isoStr).toLocaleDateString('en-AU', {
      day: '2-digit', month: 'short', year: 'numeric', timeZone: NEM_TZ,
    });
  }

  function formatStat(val, suffix = '', decimals = 1) {
    if (val === null || val === undefined) return '—';
    return `${parseFloat(val).toFixed(decimals)}${suffix}`;
  }

  function renderFacility(f) {
    const colors = TYPE_COLORS[f.type] || TYPE_COLORS.wind;
    const s = f.stats;

    const notFoundBanner = !f.found
      ? `<div class="not-found-banner">⚠ Facility code resolved via hint (${f.code}) — may have limited data</div>`
      : '';

    const cardEl = document.createElement('div');
    cardEl.className = 'facility-card';
    cardEl.id = `card-${f.code}`;
    cardEl.innerHTML = `
      ${notFoundBanner}
      <div class="card-header">
        <div>
          <div class="card-title">${f.name}</div>
          <div class="card-meta">${f.code} · ${f.region}${f.capacity ? ' · ' + f.capacity + ' MW installed' : ''}</div>
        </div>
        <span class="type-badge ${f.type}">${f.type}</span>
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Avg Output</div>
          <div class="stat-value">${formatStat(s.avgPowerMW, ' MW', 1)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Peak Output</div>
          <div class="stat-value">${formatStat(s.maxPowerMW, ' MW', 1)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Capacity Factor</div>
          <div class="stat-value ${s.capacityFactorPct === null ? 'muted' : ''}">${formatStat(s.capacityFactorPct, '%', 1)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Price</div>
          <div class="stat-value">${s.avgPricePerMWh !== null ? '$' + formatStat(s.avgPricePerMWh, '/MWh', 0) : '—'}</div>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="chart-${f.code}"></canvas>
      </div>
    `;

    return cardEl;
  }

  // NEM timestamps are AEST (UTC+10). The API now appends +10:00 so the browser
  // parses them correctly. We format using timeZone:'Australia/Brisbane' (UTC+10
  // fixed, same as NEM AEST) — no manual shifting needed, works in any browser.
  const NEM_TZ = 'Australia/Brisbane';

  function fmtAxisLabel(isoStr) {
    const d = new Date(isoStr);
    const day  = d.toLocaleDateString('en-AU',  { day: '2-digit', month: 'short', timeZone: NEM_TZ });
    const time = d.toLocaleTimeString('en-AU',  { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: NEM_TZ });
    return `${day} ${time}`;
  }

  function fmtTooltipTime(isoStr) {
    return new Date(isoStr).toLocaleString('en-AU', {
      day: '2-digit', month: 'short',
      hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: NEM_TZ,
    }) + ' AEST';
  }

  function buildChart(f) {
    const canvas = document.getElementById(`chart-${f.code}`);
    if (!canvas) return;

    if (!f.data || !f.data.length) {
      const wrapper = canvas.closest('.chart-wrapper');
      wrapper.innerHTML = '<div class="no-data">No data available for this period</div>';
      return;
    }

    const colors = TYPE_COLORS[f.type] || TYPE_COLORS.wind;

    // Down-sample for performance: target ~800 visible points max
    let rows = f.data;
    const MAX_POINTS = 800;
    if (rows.length > MAX_POINTS) {
      const step = Math.ceil(rows.length / MAX_POINTS);
      rows = rows.filter((_, i) => i % step === 0);
    }

    // Pre-format labels as strings — no date adapter needed
    const labels    = rows.map(r => fmtAxisLabel(r.ts));
    const rawDates  = rows.map(r => r.ts);  // kept for tooltip
    const powerData = rows.map(r => r.power);
    const priceData = rows.map(r => r.price);

    const hasPrices = priceData.some(p => p !== null);

    if (charts[f.code]) charts[f.code].destroy();

    const datasets = [
      {
        label: 'Power (MW)',
        data: powerData,
        borderColor: colors.line,
        backgroundColor: colors.fill,
        borderWidth: 1.2,
        pointRadius: 0,
        fill: true,
        tension: 0.2,
        yAxisID: 'y',
      },
    ];

    if (hasPrices) {
      datasets.push({
        label: 'Spot Price ($/MWh)',
        data: priceData,
        borderColor: 'rgba(107,114,128,0.7)',
        backgroundColor: 'transparent',
        borderWidth: 1,
        borderDash: [3, 2],
        pointRadius: 0,
        fill: false,
        tension: 0.1,
        yAxisID: 'y1',
        spanGaps: true,
      });
    }

    charts[f.code] = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0f0e0c',
            titleFont: { family: "'IBM Plex Mono', monospace", size: 10 },
            bodyFont:  { family: "'IBM Plex Mono', monospace", size: 11 },
            callbacks: {
              // Use the raw ISO date stored separately for accurate tooltip time
              title: ctx => {
                const iso = rawDates[ctx[0].dataIndex];
                return iso ? fmtTooltipTime(iso) : ctx[0].label;
              },
              label: ctx => {
                if (ctx.dataset.yAxisID === 'y')  return `Output: ${ctx.parsed.y?.toFixed(1) ?? '—'} MW`;
                if (ctx.dataset.yAxisID === 'y1') return `Price:  $${ctx.parsed.y?.toFixed(2) ?? '—'}/MWh`;
                return ctx.formattedValue;
              },
            },
          },
        },
        scales: {
          x: {
            type: 'category',
            grid: { color: '#e8e4dc', lineWidth: 0.7 },
            ticks: {
              color: '#9c9690',
              font: { family: "'IBM Plex Mono', monospace", size: 9 },
              maxTicksLimit: 10,
              maxRotation: 0,
              // Show only every Nth tick label to avoid crowding
              callback: function(val, idx) {
                const step = Math.max(1, Math.floor(this.chart.data.labels.length / 10));
                return idx % step === 0 ? this.getLabelForValue(val) : '';
              },
            },
          },
          y: {
            position: 'left',
            beginAtZero: true,
            grid: { color: '#e8e4dc', lineWidth: 0.7 },
            ticks: {
              color: colors.line,
              font: { family: "'IBM Plex Mono', monospace", size: 9 },
              callback: v => v + ' MW',
            },
            title: {
              display: true,
              text: 'Output (MW)',
              color: colors.line,
              font: { family: "'IBM Plex Sans', sans-serif", size: 9, weight: '500' },
            },
          },
          ...(hasPrices ? {
            y1: {
              position: 'right',
              grid: { drawOnChartArea: false },
              ticks: {
                color: '#6b7280',
                font: { family: "'IBM Plex Mono', monospace", size: 9 },
                callback: v => '$' + v,
              },
              title: {
                display: true,
                text: 'Price ($/MWh)',
                color: '#6b7280',
                font: { family: "'IBM Plex Sans', sans-serif", size: 9, weight: '500' },
              },
            },
          } : {}),
        },
      },
    });
  }

  // ── Orchestrate ───────────────────────────────────────────────────────────────

  async function init() {
    const mainEl = document.getElementById('main');

    try {
      const data = await loadData();

      // Update header
      document.getElementById('dateRange').textContent =
        `${fmtDate(data.dateStart)} → ${fmtDate(data.dateEnd)} AEST`;
      document.getElementById('fetchedAt').textContent =
        `Fetched: ${new Date(data.fetchedAt).toLocaleString('en-AU')}`;
      document.getElementById('legend').style.display = 'flex';

      // Build grid
      const grid = document.createElement('div');
      grid.className = 'facility-grid';

      for (const f of data.facilities) {
        grid.appendChild(renderFacility(f));
      }

      mainEl.innerHTML = '';
      mainEl.appendChild(grid);

      // Build charts after DOM settles
      requestAnimationFrame(() => {
        for (const f of data.facilities) {
          buildChart(f);
        }
      });

    } catch (err) {
      console.error('[facility-data] Error:', err);
      mainEl.innerHTML = `
        <div class="error-screen">
          <h3>⚠ Unable to Load Generator Data</h3>
          <p>${err.message}</p>
          <p style="margin-top:12px;font-size:.8rem;color:#7f1d1d;">
            Check that <code>OPENELECTRICITY_API_KEY</code> is set in your Vercel environment variables,
            and that the <code>openelectricity</code> package is installed.
          </p>
          <button class="retry-btn" onclick="location.reload()">↺ Retry</button>
        </div>
      `;
    }
  }

  init();
</script>

    <div id="globalCacheBar">
      <div class="gcb-dot" id="gcbDot"></div>
      <div class="gcb-text" id="gcbText">Checking data cache…</div>
      <button class="gcb-btn" id="gcbBtn" onclick="gcbRefresh()">↺ Refresh Facility Data</button>
    </div>

    <script>
    (function() {
      const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
      const dot  = document.getElementById('gcbDot');
      const text = document.getElementById('gcbText');
      const btn  = document.getElementById('gcbBtn');

      async function gcbCheckStatus() {
        try {
          const r = await fetch(API_BASE + '/api/cache-status');
          const s = await r.json();
          if (!s.redisConfigured) {
            dot.className = 'gcb-dot miss';
            text.textContent = 'Redis not configured — data caching disabled.';
            return;
          }
          // Only check the entry for this page
          const entry = (s.entries || []).find(e => e.label === 'Facility Data');
          if (!entry || !entry.present) {
            dot.className = 'gcb-dot miss';
            text.textContent = 'Facility data not cached — click Refresh Now to load.';
          } else if (entry.ageMinutes > 23 * 60) {
            dot.className = 'gcb-dot stale';
            text.textContent = 'Facility data cached ' + entry.ageHuman + ' — consider refreshing.';
          } else {
            dot.className = 'gcb-dot fresh';
            text.textContent = 'Facility data cached ' + entry.ageHuman + '. Auto-refreshes daily at 2 AM AEST.';
          }
        } catch(e) {
          text.textContent = 'Could not check cache status.';
        }
      }

      // Page-specific refresh: only hits /api/facility-data — stays under 60 s timeout
      window.gcbRefresh = async function() {
        btn.disabled = true;
        btn.innerHTML = '<span class="gcb-spinner"></span>Refreshing Facility data…';
        dot.className = 'gcb-dot';
        text.textContent = 'Fetching fresh facility data from OpenElectricity (may take ~20 s)…';
        try {
          const r = await fetch(API_BASE + '/api/facility-data?force=true');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          text.textContent = '✓ Facility data refreshed — reloading…';
          dot.className = 'gcb-dot fresh';
          if (typeof loadData === 'function') await loadData();
          else location.reload();
          await gcbCheckStatus();
        } catch(e) {
          text.textContent = 'Refresh failed: ' + e.message;
          dot.className = 'gcb-dot miss';
        } finally {
          btn.disabled = false;
          btn.textContent = '↺ Refresh Now';
        }
      };

      gcbCheckStatus();
      setInterval(gcbCheckStatus, 5 * 60 * 1000);
    })();
    </script>
